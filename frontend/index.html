<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Upload CSV Reports</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Upload Sales and Transaction Reports</h1>

  <form id="uploadForm" enctype="multipart/form-data">
    <input type="file" id="files" name="files[]" multiple accept=".csv" />
    <button type="submit">Upload & Generate Report</button>
  </form>

  <div id="message"></div>

  <script>
    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const filesInput = document.getElementById("files");
      const messageDiv = document.getElementById("message");

      if (filesInput.files.length === 0) {
        messageDiv.textContent = "Please select at least one CSV file.";
        messageDiv.style.color = "red";
        return;
      }

      const formData = new FormData();
      for (const file of filesInput.files) {
        formData.append("files[]", file); // ✅ matches Flask field name
      }

      messageDiv.textContent = "Uploading...";
      messageDiv.style.color = "black";

      try {
        const response = await fetch("/upload", {
          method: "POST",
          body: formData,
        });

        const result = await response.json(); // ✅ Flask returns JSON now

        if (response.ok) {
          messageDiv.textContent = result.message || "Upload successful!";
          messageDiv.style.color = "green";

          // Checks if the server returned a PDF link, offer a download
          if (result.pdf_download) {
            const link = document.createElement("a");
            link.href = result.pdf_download;
            link.textContent = "Download Generated Report";
            link.style.display = "block";
            link.style.marginTop = "10px";
            document.body.appendChild(link);
          }
        } else {
          messageDiv.textContent = result.error || "Server responded with an error.";
          messageDiv.style.color = "red";
        }
      } catch (error) {
        console.error(error);
        messageDiv.textContent = "Error uploading files. Please try again.";
        messageDiv.style.color = "red";
      }
    });
  </script>
</body>
</html>

</html>
